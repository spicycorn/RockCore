[package]
name = "rockcore"
version = "1.1.2"
description = "RockCore 岩心围岩评价系统"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自管 SQLite 单连接（替代 tauri-plugin-sql 连接池，见 main.rs 顶部说明）。
# bundled：把 SQLite 编译进 exe，不依赖系统库，任何 Windows 机器构建/运行结果一致。
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
