[package]
name = "rockcore"
version = "1.1.1"
description = "RockCore 岩心围岩评价系统"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自管 SQLite 单连接（替代 tauri-plugin-sql 连接池，见 main.rs 顶部说明）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
