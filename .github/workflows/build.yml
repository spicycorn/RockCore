name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 类型检查 + 前端构建（含引擎黄金用例测试）
        working-directory: app
        run: |
          npm test
          npm run build

      - name: 校验导入模板可解析
        working-directory: app
        run: node scripts/validate-template.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Rust 代码检查（非 tag 推送不打包，只验证可编译）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app/src-tauri
        run: cargo check

      - name: Tauri 打包 NSIS 安装包（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: npx tauri build

      - name: 创建 Release 并上传安装包、导入模板、使用说明（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "RockCore $tag" --latest --notes "RockCore $tag — Windows 安装包：下载 *_x64-setup.exe 双击安装，桌面图标启动。"
          }
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { Write-Error "未找到 NSIS 安装包"; exit 1 }
          gh release upload $tag $exe.FullName --clobber
          gh release upload $tag "app/src-tauri/resources/岩心回次统计导入模板.xlsx" --clobber
          gh release upload $tag "docs/使用说明.txt" --clobber
