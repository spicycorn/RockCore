name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 类型检查 + 前端构建（含引擎黄金用例测试）
        working-directory: app
        run: |
          npm test
          npm run build

      - name: 校验导入模板可解析
        working-directory: app
        run: node scripts/validate-template.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Tauri 发布构建（打 tag 时自动创建 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 附加导入模板与使用说明到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/resources/岩心回次统计导入模板.xlsx
            docs/使用说明.txt
